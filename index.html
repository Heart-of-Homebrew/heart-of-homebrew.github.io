<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Athenaeum Ceriad</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/aa-main.css">
</head>
<body>

<header class="topbar hidden-init">
    <div class="topbar-inner">
        <a class="logo" href="#atrium">
            <img src="assets/icon.svg" class="sigil" alt="Site Logo">
            <span>Athenaeum Ceriad</span>
        </a>

        <nav class="nav hidden-init" id="topNav">
            <a href="#atrium" class="swap" data-main="Atrium" data-alt="Home">Atrium</a>
            <a href="#archive" class="swap" data-main="Archive" data-alt="Wiki">Archive</a>
            <a href="#geocloister" class="swap" data-main="Geocloister" data-alt="Map">Geocloister</a>
            <a href="#planetarium" class="swap" data-main="Planetarium" data-alt="Star Map">Planetarium</a>
            <a href="#chronospire" class="swap" data-main="Chronospire" data-alt="Timeline">Chronospire</a>
            <a href="#gallery" class="swap" data-main="Gallery" data-alt="Artwork">Gallery</a>
            <a href="#orienta" class="swap" data-main="Orienta" data-alt="About">Orienta</a>
        </nav>

        <div class="top-actions">
            <div class="search">
                <label for="siteSearch"></label><input id="siteSearch" placeholder="Search...">
            </div>
            <button class="btn ghost" id="randomBtn">Surprise Me!</button>
        </div>
    </div>
</header>

<main id="frame"></main>

<footer>
    <div class="footer-inner">
        <div>© <strong>Athenaeum Ceriad</strong> 2025. All rights reserved.</div>
        <div style="display:flex;gap:12px">
            <a href="#" style="color:var(--muted)">Contact</a>
            <a href="#" style="color:var(--muted)">Donate</a>
            <a href="#" style="color:var(--muted)">Legal</a>
        </div>
    </div>
</footer>

<script defer type="module" src="src/aa-main.js"></script>
</body>
</html>
